<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neudi — Turnos para tu negocio</title>
  <script>
    // Redirigir a /neudi/ si estamos en la raíz del dominio
    if (location.pathname === '/' || location.pathname === '') {
      location.replace('/neudi/');
    }
    // Para cualquier otra ruta (ej: /neudi/register), cargar la app en /neudi/
    // con el path original para que React Router lo maneje
    else {
      location.replace('/neudi/index.html');
    }
  </script>
</head>
<body>
  <noscript>
    <p>Neudi requiere JavaScript para funcionar.</p>
  </noscript>
  <script>
    if (location.pathname !== '/' && location.pathname !== '/neudi/') {
      window.location.replace('/neudi/');
    }
  </script>
</body>
</html>
