<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neudi — Turnos para tu negocio</title>
  <script>
    var path = location.pathname;
    // Strip /neudi/ prefix to get the SPA route
    var spaPath = path.replace(/^\/neudi\/?/, '');
    if (spaPath === '' || spaPath === '/') {
      location.replace('/neudi/');
    } else {
      location.replace('/neudi/?_route=' + encodeURIComponent(spaPath));
    }
  </script>
</head>
<body>
  <noscript>
    <p>Neudi requiere JavaScript para funcionar.</p>
  </noscript>
  <script>
    if (location.pathname !== '/' && location.pathname !== '/neudi/') {
      window.location.replace('/neudi/');
    }
  </script>
</body>
</html>
