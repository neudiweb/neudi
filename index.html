<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var mode = localStorage.getItem('neudi-theme-mode') || 'auto';
        var theme = mode === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neudi - Turnos para tu negocio. Reservá online de forma simple y rápida." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Neudi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color-mobile" content="#000000" />
    <link rel="manifest" href="/neudi/manifest.json" />
    <link rel="apple-touch-icon" href="/neudi/pwa-192x192.png" />
