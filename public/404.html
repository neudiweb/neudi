<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neudi — Turnos para tu negocio</title>
  <script>
    // Redirigir a /neudi/ si estamos en la raíz del dominio
    if (location.pathname === '/' || location.pathname === '') {
      location.replace('/neudi/');
    }
    // Para cualquier otra ruta (ej: /neudi/register), preservar el path como ?_route=
    // para que la app SPA lo maneje con React Router
    else {
      var path = location.pathname + location.search;
      location.replace('/neudi/?_route=' + encodeURIComponent(path));
    }
  </script>
</head>
<body>
  <noscript>
    <p>Neudi requiere JavaScript para funcionar.</p>
  </noscript>
  <script>
    // Redirección para cualquier ruta que no sea la raíz
    if (location.pathname !== '/' && location.pathname !== '/neudi/') {
      window.location.replace('/neudi/');
    }
  </script>
</body>
</html>
